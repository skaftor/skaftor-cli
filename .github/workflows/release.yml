name: Release

# Cut a release by pushing a semver tag:
#   npm version patch   # bumps package.json + creates the tag
#   git push --follow-tags
#
# This workflow verifies the tag matches package.json, publishes to npm, and
# creates a GitHub Release with auto-generated notes.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write # create the GitHub Release
  id-token: write # npm provenance

jobs:
  release:
    name: Publish & release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          echo "tag=$TAG package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Smoke test before publishing
        run: |
          node --check bin/skaftor.mjs
          node bin/skaftor.mjs --version

      - name: Publish to npm (public, with provenance)
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
          body: |
            Install or upgrade:

            ```bash
            npm install -g @skaftor/cli@${{ github.ref_name }}
            # or
            curl -fsSL https://app.skaftor.com/install | sh
            ```

            See the [CHANGELOG](https://github.com/skaftor/skaftor-cli/blob/main/CHANGELOG.md) for details.
