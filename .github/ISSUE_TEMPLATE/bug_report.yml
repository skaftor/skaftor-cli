name: 🐛 Bug report
description: Something in the skaftor CLI isn't working as expected.
title: "bug: <short description>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug! Please **do not include your dev token** or the full
        MCP URL — redact the `?dev=…` part. Security issues? See [SECURITY.md](../blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
      placeholder: Running `skaftor wo next` printed a raw stack trace instead of...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The exact commands you ran (with the token redacted).
      placeholder: |
        1. skaftor login "https://app.skaftor.com/api/mcp/<projectId>?dev=REDACTED"
        2. skaftor wo next
        3. ...
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: CLI version
      description: Output of `skaftor --version`.
      placeholder: "0.1.1"
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`.
      placeholder: "v20.11.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (WSL)
        - Windows (native)
        - Other
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Skaftor host
      description: app.skaftor.com or a self-hosted origin?
      placeholder: app.skaftor.com
  - type: textarea
    id: logs
    attributes:
      label: Output / logs
      description: Paste relevant output. Redact any token.
      render: shell
